name: "Run Price Update"
on:
  workflow_dispatch:

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        
      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'
          
      - name: Install Library
        run: pip install requests
        
      - name: Run Script
        run: |
          set -ex
          python -u update_prices.py
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}   # <-- แก้ตรงนี้ให้ตรงกับชื่อที่ตั้งใน Secrets
